[package]
name = "maelstrom-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
macro_rules_attribute = "0.2.3"
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive", "alloc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.rust]
unused_qualifications = "warn"
